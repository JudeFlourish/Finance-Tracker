{% extends "base.html" %}

{% block title %}Register · Finance Tracker{% endblock %}

{% block content %}
    <h1>Create an account</h1>
    <p class="subtitle">Your expenses, income and budgets will be private to your account.</p>

    <section class="card narrow">
        <form action="{{ url_for('auth.register') }}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ email }}"
                       autocomplete="email" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <!-- new-password: lets the browser offer to make and save a strong password -->
                <input type="password" id="password" name="password" minlength="{{ min_length }}" maxlength="128"
                       autocomplete="new-password" aria-describedby="password-hint" required>
                <small id="password-hint" class="hint">At least {{ min_length }} characters.</small>
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" name="confirm" minlength="{{ min_length }}" maxlength="128"
                       autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-blue full">Create account</button>
        </form>
    </section>
{% endblock %}
