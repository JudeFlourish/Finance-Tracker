{# the four expense fields, shared by the add form and the edit page.
   values holds what to show in each field (empty for a new expense) #}
{% macro expense_fields(categories, values) %}
<div class="field">
    <label for="description">Description</label>
    <input type="text" id="description" name="description" placeholder="e.g. Lunch"
           value="{{ values.get('description', '') }}" required>
</div>
<div class="row">
    <div class="field">
        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00"
               value="{{ values.get('amount', '') }}" required>
    </div>
    <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ values.get('date', '') }}">
    </div>
</div>
<div class="field">
    <label for="category">Category</label>
    <select id="category" name="category">
        {% for c in categories %}
        <option value="{{ c }}" {% if c == values.get('category') %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
    </select>
</div>
{% endmacro %}
